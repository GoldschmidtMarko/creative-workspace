<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BAX Checker — shuttlecock">
  <rect width="64" height="64" rx="10" fill="#0a7a4a"/>
  <!-- feather skirt: wide at the top, narrowing down to the cork -->
  <path d="M18 14 L46 14 L37.5 41 L26.5 41 Z" fill="none" stroke="#f1fff7" stroke-width="3.6" stroke-linejoin="round"/>
  <!-- feather ribs -->
  <g stroke="#f1fff7" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="41" x2="32" y2="15"/>
    <line x1="21.5" y1="27" x2="42.5" y2="27"/>
  </g>
  <!-- cork -->
  <path d="M26.5 41 H37.5 A5.5 5.5 0 0 1 26.5 41 Z" fill="#f1fff7" stroke="#f1fff7" stroke-width="3" stroke-linejoin="round"/>
</svg>
