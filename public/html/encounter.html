<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="One league team encounter — every individual game's score, plus each player's own BAX for that discipline.">
    <meta name="theme-color" content="#0f766e">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Encounter | BAX Checker</title>
    <script src="/js/util/themeInit.js"></script>
    <link rel="stylesheet" href="/styles/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/styles/bax_checker.css">
    <link rel="stylesheet" href="/styles/player.css">
    <link rel="stylesheet" href="/styles/team.css">
</head>

<body>
    <header class="site-nav">
        <a class="site-nav__brand" href="/html/index.html">
            <img class="site-nav__logo" src="/favicon.svg" alt="">
            <span>BAX Checker</span>
        </a>
        <nav class="nav-pill" aria-label="Primary">
            <a class="nav-pill__link" href="/html/tournaments.html">Tournament</a>
            <a class="nav-pill__link" href="/html/player.html">Player</a>
            <a class="nav-pill__link is-active" aria-current="page" href="/html/club.html">Club</a>
        </nav>
        <div class="site-nav__actions">
            <div class="jumpto" id="jumpto">
                <button class="jumpto__btn" id="jumpto-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Jump to a player, club or tournament">
                    <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <span class="jumpto__label">Jump to…</span>
                    <span class="jumpto__kbd">⌘K</span>
                </button>
                <div class="jumpto__panel" id="jumpto-panel" role="dialog" aria-label="Jump to"></div>
            </div>
            <a id="usage-link" href="/html/components/bax_checker/usage.html" class="btn btn-secondary btn-sm hidden" title="Usage dashboard">
                <span>Usage</span>
            </a>
            <button id="auth-btn" class="btn btn-secondary btn-sm" type="button" title="Sign in with Google">Sign in</button>
            <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="Toggle light / dark">
                <i data-lucide="sun" class="icon-sun"></i>
                <i data-lucide="moon" class="icon-moon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <main class="player-main">
            <!-- Contextual "back to team" (only when arriving from one) -->
            <a id="team-return" class="tournament-return hidden" href="#">
                <span class="tournament-return__body">
                    <span class="tournament-return__eyebrow">Back to team</span>
                    <span class="tournament-return__name" id="team-return-name">Team</span>
                </span>
            </a>

            <div class="pcard" id="identity-card">
                <div class="identity">
                    <div>
                        <div class="identity__name" id="en-name">—</div>
                        <div class="identity__meta" id="en-meta"></div>
                    </div>
                    <div class="identity__links">
                        <a class="identity__dbv hidden" id="en-dbv" target="_blank" rel="noopener">
                            dbv.turnier.de
                        </a>
                    </div>
                </div>
            </div>

            <div id="en-skeleton" class="pcard">
                <div class="skeleton"><span class="spinner"></span> Loading encounter…</div>
            </div>

            <div id="en-view" class="hidden">
                <div class="pcard pcard--games">
                    <div class="pcard__head">
                        <h2>Games</h2>
                    </div>
                    <div id="games-body"></div>
                </div>
            </div>

            <div id="error-view" class="pcard hidden" style="text-align:center;">
                <div style="font-size:2rem;">😕</div>
                <h2 style="color:var(--ink); margin:0.5rem 0;">Could not load this encounter</h2>
                <p id="error-msg" style="color:var(--ink-dim);"></p>
            </div>
        </main>

        <footer class="site-footer">
            <div class="site-footer__links">
                <a href="/impressum.html">Impressum</a>
                <span aria-hidden="true">&middot;</span>
                <a href="/privacy.html">Privacy Policy</a>
            </div>
            <div class="site-footer__copy">&copy; <span id="copyright-year"></span> BAX Checker</div>
        </footer>
    </div>

    <script type="module" src="/js/util/auth.js"></script>
    <script type="module" src="/js/encounter.js"></script>
    <script src="/js/util/theme.js"></script>
    <nav class="bottom-tabbar" aria-label="Primary (mobile)">
        <a class="bottom-tabbar__item" href="/html/tournaments.html">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12v3.5a6 6 0 0 1-12 0V4Z" stroke="currentColor" stroke-width="1.4"/><path d="M10 13.5V16M7 16h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Tournament</span>
        </a>
        <a class="bottom-tabbar__item" href="/html/player.html">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 17c1-3.5 4-5 6.5-5s5.5 1.5 6.5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Player</span>
        </a>
        <a class="bottom-tabbar__item is-active" href="/html/club.html">
            <svg viewBox="0 0 20 20" fill="none"><path d="M4 17V8l6-4 6 4v9" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 17v-5h4v5" stroke="currentColor" stroke-width="1.4"/></svg>
            <span>Club</span>
        </a>
        <button class="bottom-tabbar__item" type="button" data-jumpto-trigger>
            <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Search</span>
        </button>
    </nav>

    <script type="module" src="/js/util/jumpto.js"></script>
</body>

</html>
